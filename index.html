<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Fantasy Cycling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#15181d; --muted:#6b6f77; --line:#e3ded3;
  --accent:#d9480f; --accent-ink:#fff; --ok:#1e7f4f; --warn:#b4530a; --bad:#b4232a;
  --chip:#efe9dc; --gold:#c99a2e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;color-scheme:light}
table,td,th,.card,.teamcard,.modal-box{color:var(--ink)}
header{background:var(--ink);color:#fff;padding:14px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:800 28px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;margin:0;text-transform:uppercase}
.brand .race{color:#c9c4b8;font-size:13px}
.mebox{margin-left:auto;font-size:13px;color:#c9c4b8}
.mebox b{color:#fff}
.mebox a{color:#f3b58c;cursor:pointer;margin-left:8px}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{background:none;border:0;color:#c9c4b8;font:600 15px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.6px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{font:800 22px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:0 0 10px;letter-spacing:.4px}
h3{font:700 16px/1.2 Inter,sans-serif;margin:14px 0 6px}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:#fff6ef;color:var(--ink)}
tr.expandable{cursor:pointer}
tr.expandable:hover td{background:#faf8f3}
tr.expandable.me:hover td{background:#fff0e3}
.caret{display:inline-block;margin-left:6px;color:var(--muted);font-size:12px;transition:transform .15s}
tr.open .caret{transform:rotate(90deg)}
tr.detail td{background:#faf8f3;padding-top:4px;padding-bottom:8px;border-top:0}
tr.me+tr.detail td{background:#fff6ef}
.scorers{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.scorers .n{color:var(--muted)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500}
.chip.gold{background:#f6e7bd}
.views{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.vbtn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:600 13px Inter,sans-serif;cursor:pointer}
.vbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.btn,.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font:600 14px Inter,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=password],textarea,select{font:14px Inter,sans-serif;border:1px solid #cfc9bc;border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{font-size:13px;color:var(--muted)}
.bidin{width:70px;text-align:right}
.bidin.bad{border-color:var(--bad);background:#fbe5e6;color:var(--bad)}
.sticky .hint{flex-basis:100%;font-size:13px;color:#ffb3b3}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.msg.ok{background:#e4f3ea;color:var(--ok)}
.msg.err{background:#fbe5e6;color:var(--bad)}
.msg.info{background:#fff1e6;color:var(--warn)}
.sticky{position:sticky;bottom:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;margin-top:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.sticky .k{font-size:12px;color:#c9c4b8;text-transform:uppercase;letter-spacing:.5px}
.sticky .v{font:800 22px/1 "Barlow Condensed",sans-serif}
.sticky .v.bad{color:#ff8a8a}
.sticky .btn{margin-left:auto}
.lock{color:var(--muted);font-size:12px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.teamcard{border:1px solid var(--line);border-radius:10px;padding:12px}
.teamcard h3{margin:0 0 4px;font:800 20px "Barlow Condensed",sans-serif;text-transform:uppercase}
.rules li{margin:4px 0}
.hidden{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.hidden{display:none}
.modal-box{background:#fff;border-radius:12px;padding:18px 20px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modalText{white-space:pre-wrap;font-size:14px;max-height:50vh;overflow:auto}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#eee;color:#333;margin-left:4px}
.tag.r1{background:#dfe9f7}.tag.r2{background:#e3f3df}.tag.r3{background:#f7e4d9}
.bidsInline{display:none;font-size:12px;margin-top:3px}
@media (max-width:600px){td,th{padding:6px 5px}.hidesm{display:none}.bidsCol{display:none}.bidsInline{display:block}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Fantasy Cycling</h1>
    <span class="race" id="raceName"></span>
    <span class="mebox" id="meBox"></span>
  </div>
  <nav id="nav">
    <button data-tab="stand" class="on">Klassement</button>
    <button data-tab="teams">Teams</button>
    <button data-tab="veiling">Veiling</button>
    <button data-tab="renners">Renners</button>
    <button data-tab="resultaten">Resultaten</button>
    <button data-tab="regels">Regels</button>
    <button data-tab="admin" id="adminTab">Admin</button>
  </nav>
</header>
<main>
  <div id="noapi" class="card hidden">
    <h2>Nog niet gekoppeld</h2>
    <p>Zet de URL van je Apps Script web app in <code>index.html</code> (<code>API_URL</code>) – zie README.</p>
  </div>
  <div id="loading" class="muted">Laden…</div>
  <div id="loginCard" class="card hidden">
    <h2>Wie ben je?</h2>
    <div class="row">
      <select id="loginName"></select>
      <input type="text" id="loginToken" placeholder="jouw code" style="width:120px;text-transform:uppercase">
      <button class="btn" id="loginBtn">Inloggen</button>
    </div>
    <div class="muted">Je code krijg je van de notaris. Zonder login kan je wel alles bekijken, maar niet bieden.</div>
    <div id="loginMsg"></div>
  </div>

  <section id="tab-stand"></section>
  <section id="tab-teams" class="hidden"></section>
  <section id="tab-veiling" class="hidden"></section>
  <section id="tab-renners" class="hidden"></section>
  <section id="tab-resultaten" class="hidden"></section>
  <section id="tab-regels" class="hidden"></section>
  <section id="tab-admin" class="hidden"></section>
</main>
<div id="modal" class="hidden" role="dialog" aria-modal="true">
  <div class="modal-box"><div id="modalText"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="modalNo">Annuleren</button><button class="btn" id="modalYes">OK</button></div></div>
</div>

<script>
/* ===================== CONFIG ===================== */
// Paste your Apps Script web-app URL here (ends with /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbywcN7mCc81Zvr6a7TJ3SCUnpxJKiF8qEyuWcHE3K80TCWljtdizEcnQbSwe1mWxltEXA/exec";
/* ================================================== */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null;                 // state from server
let token = localStorage.getItem('fc_token') || '';
let adminToken = localStorage.getItem('fc_admin') || '';
let draft = {};               // rider_id -> amount (unsubmitted)

async function api(params, post = false) {
  if (!API_URL) throw new Error('API_URL ontbreekt');
  let res;
  if (post) {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(params), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  } else {
    const q = new URLSearchParams(params).toString();
    res = await fetch(API_URL + '?' + q);
  }
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'onbekende fout');
  return j;
}

async function load() {
  if (!API_URL) { $('#noapi').classList.remove('hidden'); $('#loading').classList.add('hidden'); return; }
  try {
    S = await api({ action: 'state', token });
    S.riderById = Object.fromEntries(S.riders.map(r => [r.id, r]));
    $('#loading').classList.add('hidden');
    renderAll();
  } catch (e) {
    $('#loading').textContent = 'Fout bij laden: ' + e.message;
  }
}

function renderAll() {
  $('#raceName').textContent = S.config.raceName;
  renderMe();
  renderStand();
  renderTeams();
  renderVeiling();
  renderRenners();
  renderResultaten();
  renderRegels();
  renderAdmin();
}

/* ---------- login ---------- */
function renderMe() {
  const box = $('#meBox');
  if (S.me) {
    const p = S.players.find(x => x.name === S.me);
    box.innerHTML = `<b>${esc(S.me)}</b> · ${p ? p.budgetLeft : '?'}M over <a id="logout">uitloggen</a>`;
    $('#logout').onclick = () => { token = ''; localStorage.removeItem('fc_token'); draft = {}; load(); };
    $('#loginCard').classList.add('hidden');
  } else {
    box.innerHTML = `<a id="showLogin">inloggen</a>`;
    $('#showLogin').onclick = () => $('#loginCard').classList.toggle('hidden');
    const sel = $('#loginName');
    sel.innerHTML = S.players.map(p => `<option>${esc(p.name)}</option>`).join('');
    if (token) {
      $('#loginCard').classList.remove('hidden');
      $('#loginMsg').innerHTML = `<div class="msg err">Code niet herkend.</div>`;
    }
  }
}
$('#loginBtn').onclick = () => {
  token = $('#loginToken').value.trim().toUpperCase();
  localStorage.setItem('fc_token', token);
  load();
};

/* ---------- PCS startlist parser ---------- */
// PCS startlist parser – shared source for index.html and Code.gs (kept here for tests).
// Handles the "one long line" PCS copy:  "1 Team Jayco AlUla 1. DOUBLE Paul 2. DE BONDT Dries ... DS: DE MARCHI Alessandro 2 Alpecin - Premier Tech 11. BAYER Tobias ..."
// and the multi-line variants ("1. DOUBLE Paul" or "1 DOUBLE Paul" per line, team names on their own lines).
function parsePcsStartlist(text) {
  var t = String(text || '').replace(/\s+/g, ' ').trim();
  var out = [];
  // rider token: "<bib>. NAME Firstname" up to next "<bib>." / "DS:" / end
  var re = /(\d{1,3})\.\s*([^\d]+?)(?=\s*(?:\d{1,3}\.\s*[^\d]|DS:|$))/g;
  var m, prevEnd = 0, team = '', n = 0;
  while ((m = re.exec(t)) !== null) {
    var gap = t.slice(prevEnd, m.index).trim();
    if (gap) {
      // gap looks like "DS: X Y 2 Alpecin - Premier Tech" or (first) "1 Team Jayco AlUla"
      var g = gap.replace(/^[\s\S]*?DS:\s*/, '');
      var tm = g.match(/^(?:.*?\s)?(\d{1,2})\s+(.+)$/);
      if (tm) team = tm[2].trim();
      else if (!/DS:/.test(gap)) team = g.trim();
    }
    var name = m[2].replace(/\s+(DNS|DNF|OTL|DSQ)$/i, '').trim();
    if (/[A-ZÀ-Ž]{2,}/.test(name) && name.length > 3) { out.push({ name: name, team: team }); n++; }
    prevEnd = m.index + m[0].length;
  }
  return out;
}

/* ---------- in-page confirm (browser confirm() is blocked in some embeds) ---------- */
function ask(text, yesLabel) {
  return new Promise(resolve => {
    const m = $('#modal'); $('#modalText').textContent = text; $('#modalYes').textContent = yesLabel || 'OK';
    m.classList.remove('hidden');
    const done = v => { m.classList.add('hidden'); $('#modalYes').onclick = $('#modalNo').onclick = null; resolve(v); };
    $('#modalYes').onclick = () => done(true); $('#modalNo').onclick = () => done(false);
    m.onclick = e => { if (e.target === m) done(false); };
    setTimeout(() => $('#modalYes').focus(), 0);
  });
}

/* ---------- helpers ---------- */
// view = 'total' (all points) or an import label ('stage-2', 'gc', …): points of that import only
function riderPts(r, view) { return (!view || view === 'total') ? r.points : ((r.byLabel || {})[view] || 0); }
function standings(view) {
  return S.players.map(p => {
    const riders = S.riders.filter(r => r.owner === p.name);
    return { name: p.name, budgetLeft: p.budgetLeft, riders,
      points: riders.reduce((s, r) => s + riderPts(r, view), 0),
      total: riders.reduce((s, r) => s + r.points, 0),
      spent: riders.reduce((s, r) => s + (r.price || 0), 0) };
  }).sort((a, b) => b.points - a.points || b.total - a.total || b.budgetLeft - a.budgetLeft || a.name.localeCompare(b.name));
}
function roundStatus() {
  const c = S.config;
  if (c.round === 0) return { text: 'De veiling is nog niet gestart.', open: false };
  if (c.roundOpen) return { text: `Ronde ${c.round} van ${c.rounds} is open` + (c.deadline ? ` – deadline: ${c.deadline}` : ''), open: true };
  if (c.round >= c.rounds) return { text: 'De veiling is afgelopen.', open: false };
  return { text: `Ronde ${c.round} is gesloten – wachten op ronde ${c.round + 1}.`, open: false };
}

/* ---------- Klassement ---------- */
let standView = 'total';   // 'total' or an import label: which points the Klassement shows
function renderStand() {
  const imports = S.imports || [];
  // stage imports first (in stage order), then the final classifications; per-stage view needs backend v5 (byLabel)
  const views = [...imports].sort((a, b) => {
    const na = /^stage-(\d+)$/.exec(a.label), nb = /^stage-(\d+)$/.exec(b.label);
    if (na && nb) return na[1] - nb[1];
    if (na) return -1; if (nb) return 1;
    return 0;
  });
  const hasBreakdown = S.riders.some(r => r.byLabel);
  if (standView !== 'total' && !views.some(v => v.label === standView)) standView = 'total';
  const view = standView;
  const cur = views.find(v => v.label === view);
  const st = standings(view);
  const rs = roundStatus();
  const ptsLabel = S.config.scoring === 'pcs' ? 'PCS-pnt' : 'UCI-pnt';
  let h = `<div class="card"><h2>Klassement</h2><div class="muted">${esc(rs.text)} · ${imports.length ? 'Verwerkt: ' + imports.map(i => esc(i.name) + (i.locked ? ' 🔒' : '')).join(', ') : 'Nog geen resultaten verwerkt.'}</div>`;
  if (hasBreakdown && views.length) {
    h += `<div class="views"><button class="vbtn ${view === 'total' ? 'on' : ''}" data-view="total">Totaal</button>` +
      views.map(v => `<button class="vbtn ${view === v.label ? 'on' : ''}" data-view="${esc(v.label)}">${esc(v.name)}</button>`).join('') + `</div>`;
  }
  h += `<table><thead><tr><th>#</th><th>Speler</th><th class="num">${cur ? esc(cur.name) : ptsLabel}</th>${cur ? '<th class="num">Totaal</th>' : ''}<th class="num hidesm">Renners</th><th class="num ${cur ? 'hidesm' : ''}">Budget over</th></tr></thead><tbody>`;
  st.forEach((p, i) => {
    const scorers = [...p.riders].filter(r => riderPts(r, view) > 0).sort((a, b) => riderPts(b, view) - riderPts(a, view));
    const canOpen = scorers.length > 0;
    h += `<tr class="${p.name === S.me ? 'me' : ''} ${canOpen ? 'expandable' : ''}" data-player="${esc(p.name)}"><td>${i + 1}</td><td><b>${esc(p.name)}</b>${canOpen ? '<span class="caret">▸</span>' : ''}</td><td class="num"><b>${p.points}</b></td>${cur ? `<td class="num muted">${p.total}</td>` : ''}<td class="num hidesm">${p.riders.length}</td><td class="num ${cur ? 'hidesm' : ''}">${p.budgetLeft}M</td></tr>`;
    if (canOpen) {
      h += `<tr class="detail hidden" data-detail="${esc(p.name)}"><td></td><td colspan="${cur ? 5 : 4}"><div class="scorers">` +
        scorers.map(r => `<span><span class="n">${esc(r.name)}</span> <b>${riderPts(r, view)}</b></span>`).join('') +
        `</div></td></tr>`;
    }
  });
  h += `</tbody></table><div class="muted" style="font-size:12px;margin-top:6px">${cur ? `Punten van ${esc(cur.name)}; de plaats in het totaalklassement vind je onder Totaal.` : 'Klik op een speler om te zien wie de punten scoorde.'}</div></div>`;
  // top scorers (of the selected view)
  const top = [...S.riders].filter(r => riderPts(r, view) > 0).sort((a, b) => riderPts(b, view) - riderPts(a, view) || b.points - a.points).slice(0, 10);
  if (top.length) {
    h += `<div class="card"><h2>Topscorers${cur ? ' – ' + esc(cur.name) : ''}</h2><table><thead><tr><th>Renner</th><th class="hidesm">Ploeg</th><th>Eigenaar</th><th class="num">Pnt</th><th class="num" title="${cur ? 'totaal over alle etappes' : 'punten per miljoen'}">${cur ? 'Totaal' : 'Pnt/M'}</th></tr></thead><tbody>`;
    top.forEach(r => h += `<tr><td>${esc(r.name)}</td><td class="hidesm muted">${esc(r.team)}</td><td>${r.owner ? esc(r.owner) : '<span class="muted">–</span>'}</td><td class="num"><b>${riderPts(r, view)}</b></td><td class="num muted">${cur ? r.points : ppm(r)}</td></tr>`);
    h += `</tbody></table></div>`;
  }
  $('#tab-stand').innerHTML = h;
  $('#tab-stand').querySelectorAll('.vbtn').forEach(b => b.onclick = () => { standView = b.dataset.view; renderStand(); });
  $('#tab-stand').querySelectorAll('tr.expandable').forEach(tr => tr.onclick = () => {
    const d = $('#tab-stand').querySelector(`tr[data-detail="${CSS.escape(tr.dataset.player)}"]`);
    if (!d) return;
    d.classList.toggle('hidden');
    tr.classList.toggle('open', !d.classList.contains('hidden'));
  });
}
// points per million: a rider's return on the price paid; '–' for unsold riders
function ppmVal(r) { return (r.owner && r.price) ? r.points / r.price : -1; }
function ppm(r) { return ppmVal(r) < 0 ? '–' : ppmVal(r).toFixed(1); }

/* ---------- Teams ---------- */
function renderTeams() {
  const st = standings();
  let h = `<div class="grid">`;
  st.forEach(p => {
    h += `<div class="teamcard"><h3>${esc(p.name)}</h3><div class="muted">${p.points} pnt · ${p.riders.length}/${S.config.maxRiders} renners · ${p.spent}M uitgegeven · ${p.budgetLeft}M over</div>`;
    if (p.riders.length) {
      h += `<table><tbody>`;
      [...p.riders].sort((a, b) => b.points - a.points || (b.price || 0) - (a.price || 0)).forEach(r => {
        h += `<tr><td>${esc(r.name)}<span class="tag r${r.round}">R${r.round}</span></td><td class="num muted">${r.price}M</td><td class="num"><b>${r.points}</b></td></tr>`;
      });
      h += `</tbody></table>`;
    } else h += `<div class="muted" style="margin-top:8px">Nog geen renners.</div>`;
    h += `</div>`;
  });
  h += `</div>`;
  $('#tab-teams').innerHTML = h;
}

/* ---------- Veiling ---------- */
function renderVeiling() {
  const c = S.config, rs = roundStatus();
  let h = `<div class="card"><h2>Veiling</h2><div class="msg ${rs.open ? 'ok' : 'info'}">${esc(rs.text)}</div>`;

  if (rs.open) {
    if (!S.me) {
      h += `<div class="muted">Log in om te bieden.</div></div>`;
    } else {
      const me = S.players.find(p => p.name === S.me);
      const myBids = S.bids.filter(b => b.round === c.round && b.player === S.me);
      const owned = S.riders.filter(r => r.owner === S.me).length;
      const lockedTotal = myBids.reduce((s, b) => s + b.amount, 0);
      const draftTotal = Object.values(draft).reduce((s, v) => s + (Number(v) || 0), 0);
      const slots = c.maxRiders - owned - myBids.length;
      h += `<div class="muted">Bied per miljoen (geheel getal, min. ${c.minBid}M). Som van al je biedingen deze ronde ≤ je budget. Een ingediend bod is <b>definitief</b>. Hoogste bod wint; bij ex aequo blijft de renner vrij.</div>`;
      if (myBids.length) {
        h += `<h3>Jouw ingediende biedingen (ronde ${c.round})</h3><table><tbody>`;
        myBids.forEach(b => h += `<tr><td>${esc(S.riderById[b.rider_id]?.name || b.rider_id)}</td><td class="num">${b.amount}M <span class="lock">🔒</span></td></tr>`);
        h += `</tbody></table>`;
      }
      h += `<h3>Vrije renners</h3><div class="row"><input type="text" id="bidSearch" placeholder="zoek renner of ploeg…" style="flex:1"></div>
      <div id="bidList"></div>
      <div class="sticky">
        <div><div class="k">Budget</div><div class="v">${me.budgetLeft}M</div></div>
        <div><div class="k">Ingediend</div><div class="v">${lockedTotal}M</div></div>
        <div><div class="k">Nieuw</div><div class="v ${lockedTotal + draftTotal > me.budgetLeft ? 'bad' : ''}" id="draftTotal">${draftTotal}M</div></div>
        <div><div class="k">Plaatsen</div><div class="v ${Object.keys(draft).length > slots ? 'bad' : ''}" id="slotsLeft">${slots}</div></div>
        <button class="btn" id="submitBids" disabled>Biedingen indienen</button>
        <div class="hint" id="bidHint"></div>
      </div><div id="bidMsg"></div></div>`;
    }
  } else h += `</div>`;

  // closed rounds
  for (let r = c.round; r >= 1; r--) {
    if (r === c.round && c.roundOpen) continue;
    const bids = S.bids.filter(b => b.round === r);
    const byRider = {};
    bids.forEach(b => (byRider[b.rider_id] = byRider[b.rider_id] || []).push(b));
    const rows = Object.keys(byRider).map(id => {
      const list = byRider[id].sort((a, b) => b.amount - a.amount);
      const rider = S.riderById[id] || { name: id };
      const sold = rider.owner && rider.round === r;
      return { rider, list, sold, max: list[0].amount };
    }).sort((a, b) => b.max - a.max);
    h += `<div class="card"><details ${r === c.round ? 'open' : ''}><summary>Ronde ${r} – ${rows.filter(x => x.sold).length} verkocht, ${rows.filter(x => !x.sold).length} ex aequo</summary>`;
    if (!rows.length) h += `<div class="muted">Geen biedingen.</div>`;
    else {
      h += `<table class="bidsTable"><thead><tr><th>Renner</th><th>Resultaat</th><th class="bidsCol">Alle biedingen</th></tr></thead><tbody>`;
      rows.forEach(x => {
        h += `<tr><td>${esc(x.rider.name)}</td><td>${x.sold ? `<b>${esc(x.rider.owner)}</b> · ${x.rider.price}M` : `<span class="chip">ex aequo ${x.max}M – blijft vrij</span>`}<div class="bidsInline muted">${x.list.map(b => `${esc(b.player)} ${b.amount}`).join(' · ')}</div></td><td class="bidsCol muted">${x.list.map(b => `${esc(b.player)} ${b.amount}`).join(' · ')}</td></tr>`;
      });
      h += `</tbody></table>`;
    }
    h += `</details></div>`;
  }
  $('#tab-veiling').innerHTML = h;
  if (rs.open && S.me) {
    renderBidList();
    $('#bidSearch').oninput = renderBidList;
    $('#submitBids').onclick = submitBids;
  }
}

function renderBidList() {
  const q = ($('#bidSearch')?.value || '').toLowerCase();
  const myBidIds = new Set(S.bids.filter(b => b.round === S.config.round && b.player === S.me).map(b => b.rider_id));
  const free = S.riders.filter(r => !r.owner && !myBidIds.has(r.id) && (!q || (r.name + ' ' + r.team).toLowerCase().includes(q)));
  // keep drafted riders on top
  free.sort((a, b) => (draft[b.id] ? 1 : 0) - (draft[a.id] ? 1 : 0) || (Number(draft[b.id]) || 0) - (Number(draft[a.id]) || 0) || a.team.localeCompare(b.team) || a.name.localeCompare(b.name));
  let h = `<table><thead><tr><th>Renner</th><th class="hidesm">Ploeg</th><th class="num">Bod (M)</th></tr></thead><tbody>`;
  free.slice(0, 250).forEach(r => {
    h += `<tr><td>${esc(r.name)}</td><td class="hidesm muted">${esc(r.team)}</td><td class="num"><input class="bidin" type="number" min="${S.config.minBid}" step="1" data-id="${esc(r.id)}" value="${draft[r.id] ?? ''}" placeholder="–"></td></tr>`;
  });
  h += `</tbody></table>`;
  if (free.length > 250) h += `<div class="muted">Verfijn je zoekopdracht (${free.length} renners).</div>`;
  $('#bidList').innerHTML = h;
  $('#bidList').querySelectorAll('input.bidin').forEach(inp => {
    inp.oninput = () => {
      const v = inp.value.trim();
      if (v === '') delete draft[inp.dataset.id]; else draft[inp.dataset.id] = v;
      updateBidBar();
    };
    inp.onblur = () => { if (document.activeElement?.classList?.contains('bidin')) return; renderBidList(); };
  });
  updateBidBar();
}

/** Validates the draft, colours invalid inputs, updates the sticky bar and enables/disables submit. */
function updateBidBar() {
  const me = S.players.find(p => p.name === S.me);
  if (!me) return;
  const myBids = S.bids.filter(b => b.round === S.config.round && b.player === S.me);
  const locked = myBids.reduce((s, b) => s + b.amount, 0);
  const owned = S.riders.filter(r => r.owner === S.me).length;
  const slots = S.config.maxRiders - owned - myBids.length;
  const problems = [];
  let total = 0;
  const invalid = [];
  Object.entries(draft).forEach(([id, v]) => {
    const n = Number(v);
    if (!Number.isInteger(n) || n < S.config.minBid) invalid.push(S.riderById[id]?.name || id);
    else total += n;
  });
  document.querySelectorAll('input.bidin').forEach(inp => {
    const v = draft[inp.dataset.id];
    inp.classList.toggle('bad', v !== undefined && (!Number.isInteger(Number(v)) || Number(v) < S.config.minBid));
  });
  const count = Object.keys(draft).length;
  if (invalid.length) problems.push(`Ongeldig bod (geheel getal ≥ ${S.config.minBid}M) voor: ${invalid.slice(0, 3).join(', ')}${invalid.length > 3 ? '…' : ''}.`);
  if (locked + total > me.budgetLeft) problems.push(`Je biedt ${total}M${locked ? ` (+ ${locked}M al ingediend)` : ''} maar hebt nog ${me.budgetLeft}M.`);
  if (count > slots) problems.push(`Je hebt nog ${slots} plaats${slots === 1 ? '' : 'en'} in je ploeg, maar biedt op ${count} renners.`);
  const dt = $('#draftTotal'), sl = $('#slotsLeft'), btn = $('#submitBids'), hint = $('#bidHint');
  if (!dt) return;
  dt.textContent = total + 'M';
  dt.classList.toggle('bad', locked + total > me.budgetLeft);
  sl.textContent = slots - count;
  sl.classList.toggle('bad', count > slots);
  hint.textContent = problems.join(' ');
  btn.disabled = problems.length > 0 || count === 0;
}

async function submitBids() {
  const bids = Object.entries(draft).map(([rider_id, amount]) => ({ rider_id, amount: Number(amount) }));
  const msg = $('#bidMsg');
  if (!bids.length) { msg.innerHTML = `<div class="msg err">Vul eerst een bod in.</div>`; return; }
  const bad = bids.find(b => !Number.isInteger(b.amount) || b.amount < S.config.minBid);
  if (bad) { msg.innerHTML = `<div class="msg err">Ongeldig bod voor ${esc(S.riderById[bad.rider_id].name)}: geheel getal ≥ ${S.config.minBid}M.</div>`; return; }
  const total = bids.reduce((s, b) => s + b.amount, 0);
  const lines = bids.map(b => `${S.riderById[b.rider_id].name}: ${b.amount}M`).join('\n');
  if (!await ask(`Je dient ${bids.length} bod/biedingen in voor ${total}M totaal:\n\n${lines}\n\nDit is definitief en kan niet gewijzigd worden.`, 'Indienen')) return;
  $('#submitBids').disabled = true;
  try {
    await api({ action: 'bid', token, round: S.config.round, bids }, true);
    draft = {};
    await load();
    document.querySelector('[data-tab=veiling]').click();
    $('#bidMsg').innerHTML = `<div class="msg ok">Biedingen ingediend.</div>`;
  } catch (e) {
    msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    $('#submitBids').disabled = false;
  }
}

function bookmarkletCode() {
  const site = location.origin + location.pathname;
  const code = `(function(){var T=[].slice.call(document.querySelectorAll('table')).filter(function(t){return t.offsetParent!==null&&t.tHead&&/\\b(UCI|Pnt)\\b/i.test(t.tHead.innerText)});if(!T.length){alert('Geen resultatentabel gevonden. Open de uitslag van een etappe of een eindklassement op PCS.');return;}var t=T[0],H=[].map.call(t.tHead.rows[0].cells,function(c){return c.innerText.trim().toLowerCase()});var ir=H.indexOf('rider'),it=H.indexOf('team'),iu=H.indexOf('uci'),ip=H.indexOf('pnt');if(ip<0)ip=H.indexOf('pcs');if(ir<0||(iu<0&&ip<0)){alert('Kolommen Rider/UCI/Pnt niet gevonden.');return;}function n(c){return c?parseInt((c.innerText||'').replace(/[^\\d]/g,''),10)||0:0}var rows=[];[].forEach.call(t.tBodies[0].rows,function(r){var c=r.cells;if(c.length<=ir)return;var u=iu>=0?n(c[iu]):0,q=ip>=0?n(c[ip]):0;if(!u&&!q)return;var a=c[ir].querySelector('a');rows.push({name:(a?a.innerText:c[ir].innerText).trim().replace(/\\s+/g,' '),team:it>=0?c[it].innerText.trim():'',uci:u,pcs:q,href:a?a.getAttribute('href'):''})});var p={url:location.href,title:document.title,rows:rows};window.open(${JSON.stringify(site)}+'#import='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(p))))),'_blank');})();`;

  h += `<div class="card"><h3>1. Spelers</h3><div class="muted">${S.players.map(p => esc(p.name)).join(', ') || 'nog geen spelers'}</div>
  <div class="row"><input type="text" id="newPlayer" placeholder="naam"><button class="btn ghost" data-act="addPlayer">Speler toevoegen</button></div>
  <div class="muted">De code die verschijnt, bezorg je privé aan de speler. (Ook zichtbaar in de Players-tab van de sheet.)</div></div>`;

  h += `<div class="card"><h3>2. Startlijst</h3><div class="muted">${S.riders.length} renners geladen. Ga op PCS naar de startlist-pagina van de wedstrijd, selecteer alles (Ctrl/Cmd+A), kopieer en plak hieronder. Ploegnamen worden herkend uit de kopjes; renners uit regels zoals "1 EVENEPOEL Remco". Alternatief: één regel per renner "NAAM Voornaam;Ploeg".</div>
  <textarea id="startlistText" placeholder="plak hier de startlijst…"></textarea>
  <div class="row"><button class="btn ghost" data-act="importStartlist">Startlijst importeren</button></div></div>`;

  h += `<div class="card"><h3>3. Veiling</h3><div class="muted">Status: ${esc(roundStatus().text)}</div>
  <div class="row"><input type="text" id="deadline" placeholder="deadline tekst, bv. za 11/10 20:00" value="${esc(c.deadline)}" style="width:260px">
  <button class="btn" data-act="openRound" ${c.roundOpen || c.round >= c.rounds ? 'disabled' : ''}>Ronde ${Math.min(c.round + 1, c.rounds)} openen</button>
  <button class="btn ghost" data-act="setDeadline" ${!c.roundOpen ? 'disabled' : ''}>Deadline aanpassen</button>
  <button class="btn danger" data-act="closeRound" ${!c.roundOpen ? 'disabled' : ''}>Ronde ${c.round} sluiten &amp; toewijzen</button></div></div>`;

  h += `<div class="card"><h3>Puntentelling</h3><div class="muted">Beide kolommen worden bij elke import bewaard; deze keuze bepaalt welke telt en kan dus ook achteraf nog gewisseld worden. Nu: <b>${c.scoring === 'pcs' ? 'PCS-punten' : 'UCI-punten'}</b>.</div>
  <div class="row"><button class="btn ${c.scoring === 'uci' ? '' : 'ghost'}" data-act="setScoring" data-val="uci">UCI-punten</button><button class="btn ${c.scoring === 'pcs' ? '' : 'ghost'}" data-act="setScoring" data-val="pcs">PCS-punten</button></div></div>`;

  h += `<div class="card"><h3>4. Resultaten</h3><div class="muted">Spelers sturen resultaten normaal zelf door via de tab Resultaten. Hier kan je als notaris een import <b>overschrijven of verwijderen</b>, ook na het slot. Plak de PCS-tabel en kies het label. Verwerkt: ${(S.imports || []).map(i => `<span class="chip">${esc(i.name)}${i.locked ? ' 🔒' : ''}</span>`).join(' ') || 'niets'}</div>
  <div class="row"><select id="resLabel">${labelOptions()}</select></div>
  <textarea id="resText" placeholder="plak hier de resultatentabel (kolommen met Rider, Team, UCI)…"></textarea>
  <div class="row"><button class="btn" data-act="importResults">Punten importeren</button><button class="btn ghost" data-act="deleteResults">Label verwijderen</button></div></div>`;

  h += `<div class="card"><h3>Gevarenzone</h3><div class="row"><button class="btn danger" data-act="reset">Reset veiling &amp; punten</button><span class="muted">Spelers en renners blijven, biedingen/eigenaars/punten worden gewist.</span></div></div>`;

  $('#tab-admin').innerHTML = h;
  $('#adminTok').onchange = e => { adminToken = e.target.value.trim(); localStorage.setItem('fc_admin', adminToken); };
  $('#tab-admin').querySelectorAll('[data-act]').forEach(b => b.onclick = () => adminAction(b.dataset.act, b));
}

async function adminAction(act, btn) {
  adminToken = $('#adminTok').value.trim(); localStorage.setItem('fc_admin', adminToken);
  const msg = $('#adminMsg');
  const p = { action: act, adminToken };
  if (act === 'addPlayer') p.name = $('#newPlayer').value;
  if (act === 'importStartlist') {
    const raw = $('#startlistText').value;
    // PCS copies the startlist as one long line ("1 Team X 1. NAME First 2. ... DS: ..."); convert to "NAME;Team" lines
    if (/DS:/.test(raw) || raw.trim().split('\n').length < 3) {
      const parsed = parsePcsStartlist(raw);
      if (parsed.length >= 5) p.text = parsed.map(r => `${r.name};${r.team}`).join('\n');
    }
    if (!p.text) p.text = raw;
  }
  if (act === 'openRound' || act === 'setDeadline') p.deadline = $('#deadline').value;
  if (act === 'setScoring') p.scoring = btn.dataset.val;
  if (act === 'importResults' || act === 'deleteResults') { p.label = $('#resLabel').value; p.text = $('#resText').value; }
  if (act === 'closeRound' && !await ask(`Ronde ${S.config.round} sluiten?\n\nRenners worden toegewezen aan de hoogste bieders en alle biedingen worden openbaar. Daarna kan niemand nog bieden in deze ronde.`, 'Sluiten & toewijzen')) return;
  if (act === 'deleteResults' && !await ask(`Punten van "${p.label}" verwijderen?`, 'Verwijderen')) return;
  if (act === 'reset') { if (!await ask('Alle biedingen, eigenaars en punten wissen? Spelers en renners blijven staan.', 'Ja, reset')) return; p.confirm = 'RESET'; }
  btn.disabled = true;
  try {
    const r = await api(p, true);
    let t = 'OK.';
    if (act === 'addPlayer') t = `Speler <b>${esc(r.name)}</b> toegevoegd. Code: <b style="font-size:18px;letter-spacing:2px">${esc(r.token)}</b>`;
    if (act === 'importStartlist') t = `${r.parsed} renners herkend, ${r.added} nieuw toegevoegd.` + (r.sample?.length ? ` Bv. ${esc(r.sample[0].name)} (${esc(r.sample[0].team)})` : '');
    if (act === 'closeRound') t = `Ronde ${r.round} gesloten: ${r.sold} renners verkocht, ${r.ties.length} ex aequo.`;
    if (act === 'importResults') t = `${esc(r.name || r.label)}: ${r.matched} renners met punten.` + (r.unmatched.length ? `<br><span class="muted">Niet herkend (${r.unmatched.length}): ${r.unmatched.map(esc).join(' | ')}</span>` : '');
    if (act === 'deleteResults') t = `${r.removed} regels verwijderd.`;
    if (act === 'setScoring') t = `Puntentelling: ${r.scoring === 'pcs' ? 'PCS-punten' : 'UCI-punten'}.`;
    await load();
    document.querySelector('[data-tab=admin]').click();
    $('#adminMsg').innerHTML = `<div class="msg ok">${t}</div>`;
  } catch (e) {
    msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    btn.disabled = false;
  }
}

/* ---------- nav ---------- */
$('#nav').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('#nav').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + b.dataset.tab));
  location.hash = b.dataset.tab;
});
if (location.hash.startsWith('#import=')) {
  try { pendingImport = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(8)))))); }
  catch (e) { pendingImport = { error: 'Kon de gegevens van de knop niet lezen.' }; }
  history.replaceState(null, '', location.pathname + '#resultaten');
}
if (/^#[a-z]+$/.test(location.hash)) { const b = $(`#nav [data-tab=${location.hash.slice(1)}]`); if (b) b.click(); }
load();
setInterval(() => {
  const busy = Object.keys(draft).length || pendingImport || location.hash === '#admin' || [...document.querySelectorAll('textarea')].some(t => t.value);
  if (!busy && document.visibilityState === 'visible') load();
}, 60000);
</script>
</body>
</html>
